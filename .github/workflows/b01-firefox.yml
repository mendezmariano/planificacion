name: Validación de B01 en Firefox
on:
  push:
    branches: [qa/b01-firefox]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verificar el paquete de clase extraído a 1280 y 360 px
        run: |
          paquete="$RUNNER_TEMP/laboratorio para clase"
          mkdir -p "$paquete"
          TZ=UTC git archive --format=zip --output="$RUNNER_TEMP/clase.zip" HEAD dist recursos
          unzip -q "$RUNNER_TEMP/clase.zip" -d "$paquete"
          python3 scripts/observe_firefox.py --lab-root "$paquete" --output-dir "$RUNNER_TEMP/firefox"
      - name: Abrir la figura 7.3 desde la portada pública
        run: |
          mkdir -p "$RUNNER_TEMP/perfil-pages"
          firefox --headless --no-remote --profile "$RUNNER_TEMP/perfil-pages" \
            --window-size 1280,900 --screenshot "$RUNNER_TEMP/firefox/pages-figura-7.3.png" \
            'https://mendezmariano.github.io/planificacion/?figura=7.3'
      - name: Guardar el informe y las capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b01-firefox
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/firefox/report.json
            ${{ runner.temp }}/firefox/*.png
